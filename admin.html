<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Live Chat Club</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    /* Basic chat preview styles */
    .live-chat-panel { margin-top: 18px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.02); }
    .messages-list { max-height: 300px; overflow-y: auto; padding: 12px; border-radius: 8px; background: #0b0b0b; }
    .chat-message-card { background: rgba(255,255,255,0.02); padding: 10px; margin-bottom: 8px; border-radius: 8px; }
    .chat-message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .chat-name { font-weight: 700; }
    .chat-time { font-size: 0.8em; color: rgba(255,255,255,0.5); }
    .chat-text { white-space: pre-wrap; }
    .name-row { margin-top: 10px; }
    .controls { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-card">
      <h1>⚙️ ADMIN PANEL</h1>
      <p class="subtitle">Live Chat Club</p>

      <!-- Login Form -->
      <div id="loginSection" class="admin-section">
        <div class="input-group">
          <label for="adminPassword">🔒 Password Admin</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Masukkan password admin"
            autocomplete="current-password"
          />
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="login()">Masuk</button>
        <p id="loginError" class="admin-error" style="display:none;"></p>
      </div>

      <!-- Admin Controls (shown after login) -->
      <div id="adminControls" class="admin-section" style="display:none;">
        <div class="admin-status">
          <span class="status-dot"></span>
          <span>Login sebagai Admin</span>
        </div>

        <div class="admin-action-card danger-zone">
          <div class="action-icon">🗑️</div>
          <div class="action-info">
            <h3>Reset Semua Pesan</h3>
            <p>Hapus seluruh isi chat. Tindakan ini tidak bisa dibatalkan.</p>
          </div>
          <button class="btn btn-danger" id="resetBtn" onclick="confirmReset()">Reset Chat</button>
        </div>

        <p id="resetStatus" class="admin-status-msg" style="display:none;"></p>

        <button class="btn btn-secondary" onclick="logout()" style="margin-top:20px;">Keluar</button>
      </div>

      <!-- Confirm Dialog -->
      <div id="confirmOverlay" class="confirm-overlay" style="display:none;">
        <div class="confirm-dialog">
          <div class="confirm-icon">⚠️</div>
          <h3>Konfirmasi Reset</h3>
          <p>Semua pesan akan dihapus permanen. Lanjutkan?</p>
          <div class="confirm-buttons">
            <button class="btn btn-danger" onclick="doReset()">Ya, Hapus Semua</button>
            <button class="btn btn-secondary" onclick="cancelReset()">Batal</button>
          </div>
        </div>
      </div>

      <!-- Live Chat Preview (admin can test sending) -->
      <div id="liveChatPreview" class="live-chat-panel">
        <h2>Live Chat Preview</h2>
        <div id="messagesList" class="messages-list"></div>

        <div class="name-row" style="display:flex;align-items:center;gap:8px;margin-top:10px;">
          <div>Chat sebagai: <span id="displayName">Pengirim</span></div>
          <button id="changeNameBtn" class="btn">Ganti Nama</button>
        </div>

        <textarea id="chatInput" placeholder="Ketik pesan Anda di sini..." style="width:100%;height:80px;border-radius:8px;padding:10px;margin-top:8px;"></textarea>
        <div class="controls" style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
          <div id="charCount">0/200</div>
          <button id="sendBtn" class="btn btn-primary">KIRIM</button>
        </div>
      </div>

      <a href="/" class="back-link">← Kembali ke Home</a>
    </div>
  </div>

  <script>
    let adminPassword = '';
    const CORRECT_PASSWORD = 'ADM_NOYU'; // Password admin yang benar

    function login() {
      const input = document.getElementById('adminPassword');
      const password = input.value.trim();
      const errorEl = document.getElementById('loginError');

      if (!password) {
        showError('Password tidak boleh kosong');
        return;
      }

      if (password !== CORRECT_PASSWORD) {
        showError('❌ Password salah!');
        return;
      }

      adminPassword = password;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminControls').style.display = 'block';
      errorEl.style.display = 'none';
    }

    function logout() {
      adminPassword = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminControls').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      const statusMsg = document.getElementById('resetStatus');
      statusMsg.style.display = 'none';
    }

    function confirmReset() { document.getElementById('confirmOverlay').style.display = 'flex'; }
    function cancelReset() { document.getElementById('confirmOverlay').style.display = 'none'; }

    async function doReset() {
      document.getElementById('confirmOverlay').style.display = 'none';

      const resetBtn = document.getElementById('resetBtn');

      resetBtn.disabled = true;
      resetBtn.textContent = 'Menghapus...';

      try {
        if (adminPassword !== CORRECT_PASSWORD) {
          showStatus('❌ Password tidak valid. Silakan login ulang.', 'error');
          logout();
          return;
        }

        const dbRef = firebase.database().ref('messages');
        await dbRef.remove();

        showStatus('✅ Semua pesan berhasil dihapus!', 'success');
        console.log('✅ Chat messages cleared by admin');
      } catch (err) {
        console.error('Error resetting chat:', err);
        showStatus('❌ Gagal menghapus pesan: ' + (err.message || err), 'error');
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Chat';
      }
    }

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('resetStatus');
      el.textContent = msg;
      el.className = 'admin-status-msg ' + (type || '');
      el.style.display = 'block';
    }

    // Allow Enter key on password field
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('adminPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
      });
    });
  </script>

  <!-- Live chat client (connects to Realtime Database and allows sending messages) -->
  <script src="/chat.js" defer></script>
  <script>
    // Initialize live chat after firebase-config has run
    document.addEventListener('DOMContentLoaded', () => {
      if (window.initLiveChat) initLiveChat();
    });
  </script>
</body>
</html>
