<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Live Chat Club</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Styles for block user UI (kept in admin page to avoid editing global CSS) -->
  <style>
    /* ======== BLOCKED USER STYLES (Admin) ======== */
    .admin-block-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-unblock {
      background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
      color: #000;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-block {
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .blocked-tag {
      color: #ff4444;
      font-weight: 700;
      font-size: 0.85em;
      margin-left: 8px;
    }

    .admin-status-msg.small {
      margin: 8px 0 0 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-card">
      <h1>⚙️ ADMIN PANEL</h1>
      <p class="subtitle">Live Chat Club</p>

      <!-- Login Form -->
      <div id="loginSection" class="admin-section">
        <div class="input-group">
          <label for="adminPassword">🔒 Password Admin</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Masukkan password admin"
            autocomplete="current-password"
          />
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="login()">Masuk</button>
        <p id="loginError" class="admin-error" style="display:none;"></p>
      </div>

      <!-- Admin Controls (shown after login) -->
      <div id="adminControls" class="admin-section" style="display:none;">
        <div class="admin-status">
          <span class="status-dot"></span>
          <span>Login sebagai Admin</span>
        </div>

        <div class="admin-action-card danger-zone">
          <div class="action-icon">🗑️</div>
          <div class="action-info">
            <h3>Reset Semua Pesan</h3>
            <p>Hapus seluruh isi chat. Tindakan ini tidak bisa dibatalkan.</p>
          </div>
          <button class="btn btn-danger" id="resetBtn" onclick="confirmReset()">Reset Chat</button>
        </div>

        <p id="resetStatus" class="admin-status-msg" style="display:none;"></p>

        <!-- BLOCK USER PANEL -->
        <div class="admin-action-card" style="flex-direction:column;align-items:stretch;margin-top:18px;">
          <div style="display:flex;gap:8px;margin-bottom:10px;width:100%;">
            <input id="search-user" placeholder="Cari nama atau email..." style="flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,255,255,0.08);color:#fff;" />
            <button id="block-user-btn" class="btn-block" style="padding:10px 14px">Block</button>
            <button id="refresh-blocks" class="btn-secondary" style="padding:10px 14px">Refresh</button>
          </div>

          <!-- Status for block panel (errors/success) -->
          <p id="blockStatus" class="admin-status-msg small" style="display:none;"></p>

          <div id="blocked-list" class="admin-block-list"></div>
        </div>

        <button class="btn btn-secondary" onclick="logout()" style="margin-top:20px;">Keluar</button>
      </div>

      <!-- Confirm Dialog -->
      <div id="confirmOverlay" class="confirm-overlay" style="display:none;">
        <div class="confirm-dialog">
          <div class="confirm-icon">⚠️</div>
          <h3>Konfirmasi Reset</h3>
          <p>Semua pesan akan dihapus permanen. Lanjutkan?</p>
          <div class="confirm-buttons">
            <button class="btn btn-danger" onclick="doReset()">Ya, Hapus Semua</button>
            <button class="btn btn-secondary" onclick="cancelReset()">Batal</button>
          </div>
        </div>
      </div>

      <a href="/" class="back-link">← Kembali ke Home</a>
    </div>
  </div>

  <script>
    let adminPassword = '';
    const CORRECT_PASSWORD = 'ADM_NOYU'; // Password admin yang benar

    function login() {
      const input = document.getElementById('adminPassword');
      const password = input.value.trim();
      const errorEl = document.getElementById('loginError');

      if (!password) {
        showError('Password tidak boleh kosong');
        return;
      }

      // Validasi password
      if (password !== CORRECT_PASSWORD) {
        showError('❌ Password salah!');
        return;
      }

      adminPassword = password;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminControls').style.display = 'block';
      errorEl.style.display = 'none';

      // Initialize admin block UI after login
      if (window.initAdminBlock) window.initAdminBlock();
    }

    function logout() {
      adminPassword = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminControls').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
      const statusMsg = document.getElementById('resetStatus');
      statusMsg.style.display = 'none';
      const blockStatus = document.getElementById('blockStatus');
      if (blockStatus) blockStatus.style.display = 'none';
    }

    function confirmReset() {
      document.getElementById('confirmOverlay').style.display = 'flex';
    }

    function cancelReset() {
      document.getElementById('confirmOverlay').style.display = 'none';
    }

    async function doReset() {
      document.getElementById('confirmOverlay').style.display = 'none';

      const resetBtn = document.getElementById('resetBtn');
      const statusMsg = document.getElementById('resetStatus');

      resetBtn.disabled = true;
      resetBtn.textContent = 'Menghapus...';

      try {
        // Validasi password sekali lagi sebelum reset
        if (adminPassword !== CORRECT_PASSWORD) {
          showStatus('❌ Password tidak valid. Silakan login ulang.', 'error');
          logout();
          return;
        }

        // Hapus semua pesan langsung dari Firebase
        const dbRef = firebase.database().ref('messages');
        await dbRef.remove();

        showStatus('✅ Semua pesan berhasil dihapus!', 'success');
        console.log('✅ Chat messages cleared by admin');
      } catch (err) {
        console.error('Error resetting chat:', err);
        showStatus('❌ Gagal menghapus pesan: ' + err.message, 'error');
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Chat';
      }
    }

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('resetStatus');
      el.textContent = msg;
      el.className = 'admin-status-msg ' + type;
      el.style.display = 'block';
    }

    // Allow Enter key on password field
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('adminPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
      });

      // Hook refresh button for block panel if script already loaded
      document.getElementById('refresh-blocks')?.addEventListener('click', () => {
        if (window.renderBlockedPanel) window.renderBlockedPanel();
      });
    });
  </script>

  <!-- Admin block management script -->
  <script src="admin-block.js" defer></script>
</body>
</html>
