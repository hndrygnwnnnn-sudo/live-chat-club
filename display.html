<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat Display - Club Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="display-body">
  <div class="display-container">

    <!-- Live Chat Panel - Full Height -->
    <div class="live-chat-panel">
      <div class="chat-header">
        <h1>LIVE CHAT</h1>
        <span class="live-badge">● LIVE</span>
      </div>

      <div class="chat-messages-display" id="chatMessagesDisplay">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div class="empty-state-text">
            Belum ada pesan<br>
            Scan QR untuk mulai chat!
          </div>
        </div>
      </div>
    </div>

    <!-- QR Code - DRAGGABLE! -->
    <div class="qr-overlay" id="qrOverlay" draggable="true">
      <div class="qr-title">SCAN ME!</div>
      <div class="qr-code-container">
        <div id="qrcode"></div>
      </div>
      <div class="qr-instruction">📱 SCAN UNTUK CHAT</div>
      <div class="qr-subtitle">Kirim Pesan ke Layar</div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <script>
    const MAX_MESSAGES = 50;
    let messagesRef;
    let hasMessages = false;

    window.addEventListener('load', function () {
      if (typeof firebase === 'undefined' || typeof QRCode === 'undefined') return;

      messagesRef = firebase.database().ref('messages');

      setTimeout(() => {
        generateQRCode();
        loadMessages();
        setupQRDragging();
      }, 200);
    });

    function generateQRCode() {
      // URL GitHub Pages yang BENAR - hardcoded
      const chatUrl = 'https://hndrygnwnnnn-sudo.github.io/live-chat-club/chat.html';

      const qrContainer = document.querySelector('.qr-code-container');
      if (!qrContainer) return;

      qrContainer.innerHTML = '<div id="qrcode"></div>';
      new QRCode(document.getElementById('qrcode'), {
        text: chatUrl,
        width: 300,
        height: 300,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      console.log('QR Code URL:', chatUrl);
    }

    function loadMessages() {
      // Load initial messages
      messagesRef.orderByChild('timestamp').limitToLast(MAX_MESSAGES).once('value', (snapshot) => {
        const messages = [];
        snapshot.forEach((childSnapshot) => {
          messages.push(childSnapshot.val());
        });
        // Sort by timestamp ascending
        messages.sort((a, b) => a.timestamp - b.timestamp);
        messages.forEach(msg => addMessageToDisplay(msg));
      });

      // Listen for new messages only
      let lastTimestamp = 0;
      messagesRef.orderByChild('timestamp').on('child_added', (snapshot) => {
        const message = snapshot.val();
        if (message.timestamp > lastTimestamp) {
          lastTimestamp = message.timestamp;
          if (lastTimestamp !== 0) {
            addMessageToDisplay(message);
            // Auto scroll ke bawah HANYA saat pesan baru muncul
            const container = document.getElementById('chatMessagesDisplay');
            setTimeout(() => {
              container.scrollTop = container.scrollHeight;
            }, 50);
          }
        }
      });

      // Handle deleted messages
      messagesRef.on('child_removed', () => {
        const container = document.getElementById('chatMessagesDisplay');
        const messages = container.querySelectorAll('.chat-message-item');
        if (messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <div class="empty-state-text">Belum ada pesan<br>Scan QR untuk mulai chat!</div>
            </div>`;
          hasMessages = false;
        }
      });
    }

    function addMessageToDisplay(message) {
      const container = document.getElementById('chatMessagesDisplay');

      const emptyState = container.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      hasMessages = true;

      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message-item';

      const timestamp = new Date(message.timestamp).toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit'
      });

      messageDiv.innerHTML = `
        <div class="message-user">${escapeHtml(message.userName)}</div>
        <div class="message-text">${escapeHtml(message.message)}</div>
        <div class="message-time">${timestamp}</div>
      `;

      container.appendChild(messageDiv);

      // Keep max messages
      const messages = container.querySelectorAll('.chat-message-item');
      if (messages.length > MAX_MESSAGES) messages[0].remove();
    }

    // DRAGGABLE QR CODE - Mouse & Touch Support
    function setupQRDragging() {
      const qrOverlay = document.getElementById('qrOverlay');
      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      // Mouse events
      qrOverlay.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', dragMove);
      document.addEventListener('mouseup', stopDrag);

      // Touch events
      qrOverlay.addEventListener('touchstart', startDrag, false);
      document.addEventListener('touchmove', dragMove, false);
      document.addEventListener('touchend', stopDrag, false);

      function startDrag(e) {
        isDragging = true;
        const rect = qrOverlay.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        
        qrOverlay.style.cursor = 'grabbing';
      }

      function dragMove(e) {
        if (!isDragging) return;
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let newX = clientX - offsetX;
        let newY = clientY - offsetY;
        
        // Batas layar - pastikan QR tidak keluar dari viewport
        newX = Math.max(0, Math.min(newX, window.innerWidth - qrOverlay.offsetWidth));
        newY = Math.max(0, Math.min(newY, window.innerHeight - qrOverlay.offsetHeight));
        
        qrOverlay.style.position = 'fixed';
        qrOverlay.style.left = newX + 'px';
        qrOverlay.style.top = newY + 'px';
        qrOverlay.style.right = 'auto';
        qrOverlay.style.bottom = 'auto';
      }

      function stopDrag() {
        isDragging = false;
        qrOverlay.style.cursor = 'grab';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
