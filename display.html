<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat Display - Club Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="display-body">
  <div class="display-container">

    <!-- Live Chat Panel - Full Height -->
    <div class="live-chat-panel">
      <div class="chat-header">
        <h1>LIVE CHAT</h1>
        <span class="live-badge">● LIVE</span>
      </div>

      <div class="chat-messages-display" id="chatMessagesDisplay">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div class="empty-state-text">
            Belum ada pesan<br>
            Scan QR untuk mulai chat!
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <script>
    const MAX_MESSAGES = 50;
    let messagesRef;
    let hasMessages = false;

    window.addEventListener('load', function () {
      if (typeof firebase === 'undefined') return;

      messagesRef = firebase.database().ref('messages');

      setTimeout(() => {
        loadMessages();
      }, 200);
    });

    function loadMessages() {
      // Load initial messages
      messagesRef.orderByChild('timestamp').limitToLast(MAX_MESSAGES).once('value', (snapshot) => {
        const messages = [];
        snapshot.forEach((childSnapshot) => {
          messages.push(childSnapshot.val());
        });
        // Sort by timestamp ascending
        messages.sort((a, b) => a.timestamp - b.timestamp);
        messages.forEach(msg => addMessageToDisplay(msg));
      });

      // Listen for new messages only
      let lastTimestamp = 0;
      messagesRef.orderByChild('timestamp').on('child_added', (snapshot) => {
        const message = snapshot.val();
        if (message.timestamp > lastTimestamp) {
          lastTimestamp = message.timestamp;
          if (lastTimestamp !== 0) {
            addMessageToDisplay(message);
            // Auto scroll ke bawah HANYA saat pesan baru muncul
            const container = document.getElementById('chatMessagesDisplay');
            setTimeout(() => {
              container.scrollTop = container.scrollHeight;
            }, 50);
          }
        }
      });

      // Handle deleted messages
      messagesRef.on('child_removed', () => {
        const container = document.getElementById('chatMessagesDisplay');
        const messages = container.querySelectorAll('.chat-message-item');
        if (messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <div class="empty-state-text">Belum ada pesan<br>Scan QR untuk mulai chat!</div>
            </div>`;
          hasMessages = false;
        }
      });
    }

    function addMessageToDisplay(message) {
      const container = document.getElementById('chatMessagesDisplay');

      const emptyState = container.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      hasMessages = true;

      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message-item';

      const timestamp = new Date(message.timestamp).toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit'
      });

      messageDiv.innerHTML = `
        <div class="message-user">${escapeHtml(message.userName)}</div>
        <div class="message-text">${escapeHtml(message.message)}</div>
        <div class="message-time">${timestamp}</div>
      `;

      container.appendChild(messageDiv);

      // Keep max messages
      const messages = container.querySelectorAll('.chat-message-item');
      if (messages.length > MAX_MESSAGES) messages[0].remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
