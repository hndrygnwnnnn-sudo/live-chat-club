<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat - Club</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="chat-body">
  <div class="chat-container">
    <div class="chat-card">
      <div class="chat-card-header">
        <h1>💬 LIVE CHAT</h1>
        <p>Pesan Anda akan muncul di layar club!</p>
      </div>

      <!-- Name Input (shown first) -->
      <div id="nameSection" class="name-section">
        <div class="input-group">
          <label for="userName">Nama Anda:</label>
          <input 
            type="text" 
            id="userName" 
            placeholder="Masukkan nama Anda" 
            maxlength="30"
            autocomplete="off"
          >
        </div>
        <button id="startChatBtn" class="btn btn-primary" type="button">
          Mulai Chat 🚀
        </button>
        <div id="errorMessage" style="display:none; color: #ff6666; margin-top: 15px; text-align: center; font-weight: 600;"></div>
      </div>

      <!-- Chat Section (shown after name entered) -->
      <div id="chatSection" class="chat-section" style="display: none;">
        <div class="user-info">
          <span class="user-label">Chat sebagai:</span>
          <span class="user-name-display" id="userNameDisplay"></span>
          <button id="changeNameBtn" class="btn-change" type="button">Ganti Nama</button>
        </div>

        <div class="messages-container" id="messagesContainer">
          <div class="welcome-message">
            Selamat datang! Ketik pesan Anda di bawah 👇
          </div>
        </div>

        <div class="input-section">
          <textarea 
            id="messageInput" 
            placeholder="Ketik pesan Anda di sini..."
            rows="3"
            maxlength="200"
          ></textarea>
          <div class="input-footer">
            <span class="char-count" id="charCount">0/200</span>
            <button id="sendBtn" class="btn btn-send" type="button">
              Kirim 📤
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>
  
  <script>
    let userName = '';
    let messagesRef;
    let lastTimestamp = 0;
    let isInitialLoad = true;
    let firebaseReady = false;

    // Block list (client-side) keyed by uid
    const blockedSet = new Set();
    let blockedRef;

    // Current authenticated user
    let currentUser = null;

    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🔄 DOM Content Loaded - Initializing chat...');
      initializeChat();
    });

    function initializeChat() {
      // Check Firebase
      if (typeof firebase === 'undefined') {
        console.error('❌ Firebase tidak tersedia');
        showError('Firebase tidak dapat dimuat. Refresh halaman.');
        return;
      }

      try {
        // Initialize Firebase Database
        messagesRef = firebase.database().ref('messages');
        blockedRef = firebase.database().ref('blockedUsers');
        console.log('✅ Firebase Database initialized');

        // Setup auth
        if (firebase.auth) {
          firebase.auth().onAuthStateChanged((user) => {
            if (user) {
              currentUser = user;
              console.log('✅ Signed in as', user.uid);
              firebaseReady = true;
              startAfterAuth(user);
            } else {
              firebase.auth().signInAnonymously()
                .then((result) => {
                  currentUser = result.user;
                  firebaseReady = true;
                  console.log('✅ Signed in anonymously as', currentUser.uid);
                  startAfterAuth(result.user);
                })
                .catch((err) => {
                  console.error('❌ Auth error:', err);
                  firebaseReady = true;
                  startAfterAuth(null);
                });
            }
          });
        } else {
          console.warn('⚠️ Firebase Auth not available');
          firebaseReady = true;
          startAfterAuth(null);
        }
      } catch (e) {
        console.error('❌ Firebase initialization error:', e);
        showError('Terjadi kesalahan saat menghubungkan ke Firebase');
      }
    }

    function startAfterAuth(user) {
      // Listen blocked users (by uid)
      if (typeof firebase !== 'undefined') {
        try {
          blockedRef.on('value', (snap) => {
            blockedSet.clear();
            snap.forEach((c) => {
              const uid = c.key;
              if (uid) blockedSet.add(uid);
            });
            console.log('🔒 Blocked users updated:', Array.from(blockedSet));
          });
        } catch (e) {
          console.error('⚠️ Failed to attach blockedRef listener:', e);
        }
      }

      // Setup event listeners
      setupEventListeners();
      
      // Check if name already saved
      const savedName = localStorage.getItem('userName');
      if (savedName) {
        console.log('📝 Restoring saved username:', savedName);
        userName = savedName;
        showChatSection();
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Start chat button
      const startBtn = document.getElementById('startChatBtn');
      if (startBtn) {
        startBtn.addEventListener('click', function(e) {
          e.preventDefault();
          startChat();
        });
      }
      
      // Enter key on name input
      const nameInput = document.getElementById('userName');
      if (nameInput) {
        nameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            startChat();
          }
        });
      }
      
      // Send button
      const sendBtn = document.getElementById('sendBtn');
      if (sendBtn) {
        sendBtn.addEventListener('click', function(e) {
          e.preventDefault();
          sendMessage();
        });
      }
      
      // Enter key on message input (Ctrl+Enter to send)
      const msgInput = document.getElementById('messageInput');
      if (msgInput) {
        msgInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && e.ctrlKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
      
      // Character count
      if (msgInput) {
        msgInput.addEventListener('input', (e) => {
          const count = e.target.value.length;
          document.getElementById('charCount').textContent = `${count}/200`;
        });
      }
      
      // Change name button
      const changeBtn = document.getElementById('changeNameBtn');
      if (changeBtn) {
        changeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('userName');
          userName = '';
          document.getElementById('userName').value = '';
          document.getElementById('nameSection').style.display = 'block';
          document.getElementById('chatSection').style.display = 'none';
          document.getElementById('userName').focus();
        });
      }
    }

    // Start chat
    function startChat() {
      const nameInput = document.getElementById('userName');
      const name = nameInput.value.trim();
      
      if (!name) {
        showError('Masukkan nama Anda terlebih dahulu!');
        nameInput.focus();
        return;
      }
      
      if (name.length < 2) {
        showError('Nama minimal 2 karakter!');
        nameInput.focus();
        return;
      }
      
      console.log('✅ Starting chat as:', name);
      userName = name;
      localStorage.setItem('userName', userName);
      clearError();
      showChatSection();
    }

    // Show chat section
    function showChatSection() {
      console.log('📍 Showing chat section');
      document.getElementById('nameSection').style.display = 'none';
      document.getElementById('chatSection').style.display = 'block';
      document.getElementById('userNameDisplay').textContent = userName;
      document.getElementById('messageInput').focus();
      
      // Load recent messages
      loadRecentMessages();
    }

    // Load recent messages (initial load saja)
    function loadRecentMessages() {
      if (!messagesRef) {
        console.warn('⚠️ messagesRef tidak tersedia');
        return;
      }

      isInitialLoad = true;
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '<div class="welcome-message">Selamat datang! Ketik pesan Anda di bawah 👇</div>';
      
      console.log('📥 Loading recent messages...');
      // Load 10 pesan terakhir
      messagesRef.orderByChild('timestamp').limitToLast(10).once('value', (snapshot) => {
        console.log('📊 Loaded messages:', snapshot.numChildren());
        snapshot.forEach((childSnapshot) => {
          const message = childSnapshot.val();
          const timestamp = message.timestamp;
          if (timestamp > lastTimestamp) {
            lastTimestamp = timestamp;
          }
          addMessageToChat(message, false);
        });
        isInitialLoad = false;
        
        // Setelah initial load, setup listener untuk pesan baru
        setupRealtimeListener();
      }).catch((err) => {
        console.error('❌ Error loading messages:', err);
      });
    }

    // Setup real-time listener untuk pesan baru
    function setupRealtimeListener() {
      if (!messagesRef) return;

      console.log('🔔 Setting up real-time listener');
      messagesRef.orderByChild('timestamp').startAt(lastTimestamp).on('child_added', (snapshot) => {
        const message = snapshot.val();
        // Jangan tambahkan pesan yang sama 2x saat initial load
        if (message.timestamp > lastTimestamp) {
          lastTimestamp = message.timestamp;
          // Hapus welcome message jika masih ada
          const welcomeMsg = document.querySelector('.welcome-message');
          if (welcomeMsg && !isInitialLoad) {
            welcomeMsg.remove();
          }
          addMessageToChat(message, false);
        }
      });
    }

    // Send message
    function sendMessage() {
      if (!firebaseReady) {
        showError('Mohon tunggu, Firebase sedang inisialisasi...');
        return;
      }

      const messageInput = document.getElementById('messageInput');
      const message = messageInput.value.trim();
      
      if (!message) {
        showError('Ketik pesan terlebih dahulu!');
        messageInput.focus();
        return;
      }
      
      if (message.length < 2) {
        showError('Pesan minimal 2 karakter!');
        messageInput.focus();
        return;
      }

      // If we have auth info, check blocked by uid
      const uid = (currentUser && currentUser.uid) || null;
      if (uid && blockedSet.has(uid)) {
        showError('Anda diblokir dan tidak dapat mengirim pesan.');
        return;
      }

      if (!messagesRef) {
        showError('Database tidak tersedia. Silakan refresh halaman.');
        return;
      }

      // Disable button
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Mengirim...';
      clearError();
      
      // Send to Firebase - include userId when available
      const newMessage = {
        userName: userName,
        message: message,
        timestamp: Date.now()
      };
      if (uid) newMessage.userId = uid;
      
      messagesRef.push(newMessage)
        .then(() => {
          console.log('✅ Message sent!');
          messageInput.value = '';
          document.getElementById('charCount').textContent = '0/200';
          
          // Re-enable button
          sendBtn.disabled = false;
          sendBtn.textContent = 'Kirim 📤';
          messageInput.focus();
        })
        .catch((error) => {
          console.error('❌ Error sending message:', error);
          showError('Gagal mengirim pesan. Coba lagi!');
          sendBtn.disabled = false;
          sendBtn.textContent = 'Kirim 📤';
        });
    }

    // Add message to chat
    function addMessageToChat(message, isOwn) {
      // Ignore messages from blocked users (client-side) by userId if available
      if (message.userId && blockedSet.has(message.userId)) return;
      // Fallback: if no userId in message, maybe older format — optionally hide by name
      if (!message.userId && blockedSet.has((message.userName||'').toLowerCase())) return;

      const container = document.getElementById('messagesContainer');
      
      // Hapus welcome message saat pesan pertama muncul
      const welcomeMsg = container.querySelector('.welcome-message');
      if (welcomeMsg && container.children.length === 1) {
        welcomeMsg.remove();
      }
      
      const messageDiv = document.createElement('div');
      messageDiv.className = `message-bubble ${isOwn ? 'own' : 'other'}`;
      
      const timestamp = new Date(message.timestamp).toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit'
      });
      
      messageDiv.innerHTML = `
        <div class="message-header">
          <span class="message-name">${escapeHtml(message.userName)}</span>
          <span class="message-timestamp">${timestamp}</span>
        </div>
        <div class="message-content">${escapeHtml(message.message)}</div>
      `;
      
      container.appendChild(messageDiv);
      // Auto scroll ke bawah
      container.scrollTop = container.scrollHeight;
    }

    // Error display
    function showError(msg) {
      const errorEl = document.getElementById('errorMessage');
      if (errorEl) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }
    }

    function clearError() {
      const errorEl = document.getElementById('errorMessage');
      if (errorEl) {
        errorEl.style.display = 'none';
        errorEl.textContent = '';
      }
    }

    // Utility
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
